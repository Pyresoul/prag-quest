<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17110c">
<title>Prag Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IM+Fell+English:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1>Prag Quest<small>Eine Reise durch Böhmen 1403</small></h1>
  <div class="hr"><button class="grp" id="btn-group" data-s="off" aria-label="Gruppe">Gruppe</button><div class="rank" id="rank"></div></div>
</header>

<main>
  <section id="view-map" class="view active">
    <div class="chips" id="chips-map"></div>
    <div id="map"></div>
    <button class="fab" id="btn-locate" aria-label="Mein Standort"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></span></button>
  </section>

  <section id="view-list" class="view">
    <div class="chips" id="chips-list"></div>
    <div class="row">
      <button class="btn gold" id="btn-dice">Schicksalswürfel</button>
      <button class="btn" id="btn-phrases">Tschechisch</button>
    </div>
    <div id="list"></div>
  </section>

  <section id="view-plan" class="view">
    <div class="row">
      <label>Reisetage
        <select id="days-count"></select>
      </label>
      <label>Start
        <input type="date" id="start-date">
      </label>
    </div>
    <div class="row">
      <button class="btn gold" id="btn-auto">Auto-Plan aus Favoriten</button>
      <button class="btn" id="btn-share">Teilen</button>
    </div>
    <div id="plan"></div>
  </section>

  <section id="view-quest" class="view">
    <div id="quest"></div>
  </section>
</main>

<nav class="tabs">
  <button data-view="map" class="active"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg></span>Karte</button>
  <button data-view="list"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span>Entdecken</button>
  <button data-view="plan"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2zM9 8h6M9 12h6M9 16h4"/></svg></span>Plan</button>
  <button data-view="quest"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/></svg></span>Quest</button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-body" id="sheet-body"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
