<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1410">
<title>Prag Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1>⚜ Prag Quest</h1>
  <div class="rank" id="rank"></div>
</header>

<main>
  <section id="view-map" class="view active">
    <div class="chips" id="chips-map"></div>
    <div id="map"></div>
    <button class="fab" id="btn-locate" aria-label="Mein Standort">◎</button>
  </section>

  <section id="view-list" class="view">
    <div class="chips" id="chips-list"></div>
    <div class="row">
      <button class="btn gold" id="btn-dice">🎲 Schicksalswürfel</button>
      <button class="btn" id="btn-phrases">🗣 Tschechisch</button>
    </div>
    <div id="list"></div>
  </section>

  <section id="view-plan" class="view">
    <div class="row">
      <label>Reisetage
        <select id="days-count"></select>
      </label>
      <label>Start
        <input type="date" id="start-date">
      </label>
    </div>
    <div class="row">
      <button class="btn gold" id="btn-auto">✨ Auto-Plan aus Favoriten</button>
      <button class="btn" id="btn-share">📤 Teilen</button>
    </div>
    <div id="plan"></div>
  </section>

  <section id="view-quest" class="view">
    <div id="quest"></div>
  </section>
</main>

<nav class="tabs">
  <button data-view="map" class="active"><span>🗺</span>Karte</button>
  <button data-view="list"><span>🧭</span>Entdecken</button>
  <button data-view="plan"><span>📜</span>Plan</button>
  <button data-view="quest"><span>🏆</span>Quest</button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-body" id="sheet-body"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
