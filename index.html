<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0806">
<title>Prag Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span id="logo"></span><h1>Prag Quest<small>Eine Reise durch Böhmen 1403</small></h1></div>
  <div class="hr"><button class="grp" id="btn-group" data-s="off" aria-label="Gruppe">Gruppe</button><div class="rank" id="rank"></div></div>
</header>

<main>
  <section id="view-map" class="view active">
    <div class="shields" id="chips-map"></div>
    <div id="map"></div>
    <button class="fab fab2" id="btn-offline" aria-label="Offline-Karte"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></span></button>
    <button class="fab" id="btn-locate" aria-label="Mein Standort"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></span></button>
  </section>

  <section id="view-list" class="view">
    <div class="shields" id="chips-list"></div>
    <div class="row">
      <button class="btn gold" id="btn-dice">Schicksalswürfel</button>
    </div>
    <div id="list"></div>
  </section>

  <section id="view-plan" class="view">
    <div class="row">
      <label>Reisetage
        <select id="days-count"></select>
      </label>
      <label>Start
        <input type="date" id="start-date">
      </label>
    </div>
    <div class="row">
      <button class="btn gold" id="btn-auto">Auto-Plan aus Favoriten</button>
      <button class="btn gold" id="btn-auto-vote">Auto-Plan aus Abstimmung</button>
      <button class="btn" id="btn-hours">Öffnungszeiten laden</button>
      <button class="btn" id="btn-share">Teilen</button>
    </div>
    <div id="plan"></div>
  </section>

  <section id="view-farkle" class="view">
    <div id="farkle"></div>
  </section>

  <section id="view-lang" class="view">
    <div class="cz-intro" id="cz-intro"></div>
    <input id="cz-q" type="search" placeholder="Suchen: Deutsch oder Tschechisch" style="width:100%;margin-bottom:8px">
    <div class="chips" id="cz-chips"></div>
    <div id="cz-list"></div>
  </section>

  <section id="view-cash" class="view">
    <h2 class="sec">Kronen-Umrechner</h2>
    <div class="row"><label>Euro<input id="cv-eur" type="text" inputmode="decimal"></label><label>Kronen (Kč)<input id="cv-czk" type="text" inputmode="decimal"></label></div>
    <div class="hint" id="rate"></div>
    <h2 class="sec">Groschen-Kasse</h2>
    <div class="row"><label>Was<input id="x-what" type="text" maxlength="40" placeholder="z. B. Abendessen"></label></div>
    <div class="row"><label>Betrag<input id="x-amt" type="text" inputmode="decimal"></label><label>Währung<select id="x-cur"><option>Kč</option><option>€</option></select></label></div>
    <div class="row"><label>Bezahlt von<select id="x-payer"></select></label></div>
    <div class="chips-wrap" id="x-for"></div>
    <button class="btn gold" id="x-add" style="width:100%;margin-top:6px">Eintragen</button>
    <div id="cash-out"></div>
  </section>

  <section id="view-quest" class="view">
    <div id="quest"></div>
  </section>
</main>

<nav class="tabs">
  <button data-view="map" class="active"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg></span>Karte</button>
  <button data-view="list"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span>Entdecken</button>
  <button data-view="plan"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2zM9 8h6M9 12h6M9 16h4"/></svg></span>Plan</button>
  <button data-view="cash"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.6-1-1.6-1.5-3-1.5-1.8 0-3 1-3 2.3s1.2 2 3 2.4 3 1.1 3 2.4-1.2 2.4-3 2.4c-1.4 0-2.5-.6-3-1.6M12 6.5v1.5M12 16v1.5"/></svg></span>Kasse</button>
  <button data-view="lang"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M8 9h8M8 12h5"/></svg></span>Sprache</button>
  <button data-view="farkle"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="9" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="9" cy="15" r="1" fill="currentColor"/><circle cx="15" cy="15" r="1" fill="currentColor"/></svg></span>Farkle</button>
  <button data-view="quest"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/></svg></span>Quest</button>
</nav>

<input type="file" id="photo-in" accept="image/*" capture="environment" hidden>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-body" id="sheet-body"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script src="czech.js"></script>
<script src="rabbits.js"></script>
<script src="farkle.js"></script>
<script src="app.js"></script>
</body>
</html>
